<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System</title>
    <link rel="stylesheet" href="class.css" />
  </head>
  <body>
    <div class="parent">
      <img src="images/sun.png" alt="" />
      <div class="mercury">
        <img src="images/Mercury-whitebg.png" alt="Mercury" />
      </div>
      <div class="mercury-orbit"></div>

      <div class="venus">
        <img src="images/venus-whitebg.png" alt="Venus" />
      </div>
      <div class="venus-orbit"></div>

      <div class="earth">
        <img class="earthrotate" src="images/Earth-whitebg.png" alt="earth" />
      </div>
      <div class="earth-orbit"></div>
      <div class="mars"><img src="images/Mars-whitebg.png" alt="Mars" /></div>
      <div class="mars-orbit"></div>

      <div class="jupiter">
        <img src="images/Jupiter-whitebg.png" alt="Jupiter" />
      </div>
      <div class="jupiter-orbit"></div>

      <div class="saturn">
        <img src="images/Sartun-whitebg.png" alt="Saturn" />
      </div>
      <div class="saturn-orbit"></div>

      <div class="uranus">
        <img src="images/uranus-whitebg.png" alt="Uranus" />
      </div>
      <div class="uranus-orbit"></div>

      <div class="neptune">
        <img src="images/Neptune-whitebg.png" alt="neptune" />
      </div>
      <div class="neptune-orbit"></div>
    </div>
    <!-- <div class="pluto">
      <div class="pluto-orbit"></div>
      <img src="images/Neptune-whitebg.png" alt="neptune" />
    </div> -->
  </body>
</html>
